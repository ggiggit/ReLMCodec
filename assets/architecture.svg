<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 310" role="img" aria-labelledby="title desc">
  <title id="title">ReLMCodec inference architecture</title>
  <desc id="desc">A 16 kHz waveform passes through frozen W2v-BERT and an acoustic encoder, is fused by PAPA, quantized by one codebook at 50 tokens per second, and decoded by Vocos and ISTFT.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop offset="0" stop-color="#101d38"/>
      <stop offset="1" stop-color="#172b4e"/>
    </linearGradient>
    <linearGradient id="semantic" x2="1" y2="1">
      <stop offset="0" stop-color="#183955"/>
      <stop offset="1" stop-color="#1d4e67"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="1">
      <stop offset="0" stop-color="#30689a"/>
      <stop offset="1" stop-color="#435bc1"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#6dd7de" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #f8fbff; }
      .label { font-size: 21px; font-weight: 700; }
      .detail { font-size: 14px; fill: #b9d2e7; }
      .chip { font-size: 13px; font-weight: 600; fill: #8de6df; letter-spacing: .4px; }
      .line { fill: none; stroke: #6dd7de; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="1" y="1" width="1448" height="308" rx="24" fill="url(#background)" stroke="#284567" stroke-width="2"/>
  <text x="40" y="39" class="chip">PRESERVE · CONTROL · REFINE</text>
  <text x="1410" y="39" class="detail" text-anchor="end">One codebook · 50 tokens / second</text>

  <path class="line" d="M205 153 H230 Q243 153 243 140 V95 H267"/>
  <path class="line" d="M205 157 H230 Q243 157 243 170 V215 H267"/>
  <path class="line" d="M480 95 H509 Q524 95 524 110 V145 H547"/>
  <path class="line" d="M480 215 H509 Q524 215 524 200 V165 H547"/>
  <path class="line" d="M752 155 H817"/>
  <path class="line" d="M1002 155 H1057"/>
  <path class="line" d="M1257 155 H1305"/>

  <rect x="40" y="112" width="165" height="86" rx="16" fill="#263856" stroke="#446688"/>
  <text x="122" y="150" class="label" text-anchor="middle">Speech</text>
  <text x="122" y="177" class="detail" text-anchor="middle">mono · 16 kHz</text>

  <rect x="268" y="58" width="212" height="74" rx="16" fill="url(#semantic)" stroke="#388fa3"/>
  <text x="374" y="89" class="label" text-anchor="middle">W2v-BERT</text>
  <text x="374" y="114" class="detail" text-anchor="middle">frozen · layer 17</text>

  <rect x="268" y="178" width="212" height="74" rx="16" fill="url(#semantic)" stroke="#388fa3"/>
  <text x="374" y="209" class="label" text-anchor="middle">Acoustic encoder</text>
  <text x="374" y="234" class="detail" text-anchor="middle">reconstruction detail</text>

  <rect x="548" y="112" width="204" height="86" rx="16" fill="url(#accent)" stroke="#85b2ff"/>
  <text x="650" y="148" class="label" text-anchor="middle">PAPA</text>
  <text x="650" y="177" class="detail" text-anchor="middle">anchored fusion</text>

  <rect x="818" y="112" width="184" height="86" rx="16" fill="#27546a" stroke="#5cbfc3"/>
  <text x="910" y="148" class="label" text-anchor="middle">EMA-VQ</text>
  <text x="910" y="177" class="detail" text-anchor="middle">8K or 64K codes</text>

  <rect x="1058" y="112" width="199" height="86" rx="16" fill="#263f63" stroke="#6180ba"/>
  <text x="1157" y="148" class="label" text-anchor="middle">Decoder</text>
  <text x="1157" y="177" class="detail" text-anchor="middle">Vocos + ISTFT</text>

  <rect x="1306" y="112" width="104" height="86" rx="16" fill="#263856" stroke="#446688"/>
  <text x="1358" y="150" class="label" text-anchor="middle">WAV</text>
  <text x="1358" y="177" class="detail" text-anchor="middle">16 kHz</text>

  <text x="725" y="276" class="detail" text-anchor="middle">Single-stream neural speech coding at 650 / 800 bps</text>
</svg>
